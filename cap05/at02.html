<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Usuário</title>

  <script>
    function mostrarCampoOutro() {
      const outro = document.getElementById("outro");
      const campo = document.getElementById("genero_outro");

      if (outro.checked) {
        campo.style.display = "inline-block";
      } else {
        campo.style.display = "none";
      }
    }
  </script>
</head>
<body>

  <h1>Formulário de Cadastro</h1>

  <form action="https://httpbin.org/post" method="post">

    <p>
      <label for="nome">Nome completo:</label><br>
      <input
        type="text"
        id="nome"
        name="nome"
        required
        minlength="3"
      >
    </p>

    <p>
      <label for="email">E-mail:</label><br>
      <input
        type="email"
        id="email"
        name="email"
        required
      >
    </p>

    <p>
      <label for="senha">Senha:</label><br>
      <input
        type="password"
        id="senha"
        name="senha"
        required
        minlength="8"
      >
    </p>

    <p>
      <label for="nascimento">Data de nascimento:</label><br>
      <input
        type="date"
        id="nascimento"
        name="nascimento"
        required
      >
    </p>

    <fieldset>
      <legend>Gênero</legend>

      <input
        type="radio"
        id="masculino"
        name="genero"
        value="masculino"
        onclick="mostrarCampoOutro()"
      >
      <label for="masculino">Masculino</label><br>

      <input
        type="radio"
        id="feminino"
        name="genero"
        value="feminino"
        onclick="mostrarCampoOutro()"
      >
      <label for="feminino">Feminino</label><br>

      <input
        type="radio"
        id="outro"
        name="genero"
        value="outro"
        onclick="mostrarCampoOutro()"
      >
      <label for="outro">Outro</label>

      <input
        type="text"
        id="genero_outro"
        name="genero_outro"
        placeholder="Especifique"
        style="display: none; margin-left: 10px;"
      >
      <br>

      <input
        type="radio"
        id="prefiro_nao_informar"
        name="genero"
        value="prefiro_nao_informar"
        onclick="mostrarCampoOutro()"
      >
      <label for="prefiro_nao_informar">
        Prefiro não informar
      </label>
    </fieldset>

    <p>
      <input
        type="checkbox"
        id="aceite"
        name="aceite"
        value="sim"
        required
      >

      <label for="aceite">
        Aceito os termos de uso
      </label>
    </p>

    <p>
      <button type="submit">Criar conta</button>

      <button type="reset">Limpar campos</button>
    </p>

  </form>

</body>
</html>
